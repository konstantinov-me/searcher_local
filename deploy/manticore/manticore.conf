# Manticore Search — конфигурация для LocalSearch.
# Монтируется в контейнер как /etc/manticoresearch/manticore.conf

common
{
    lemmatizer_base_ru   = '/usr/share/manticore/'   # русская морфология (lemmatizer_base)
}

searchd
{
    listen         = 9306:mysql      # SQL через MySQL-протокол (клиент pymysql)
    listen         = 9308:http       # JSON API (для curl/дебага)
    log            = /var/log/manticore/searchd.log
    query_log      = /var/log/manticore/query.log
    pid_file       = /var/run/manticore/searchd.pid
    data_dir       = /var/lib/manticore   # сюда персистится RT-индекс docs
    binlog_path    = /var/lib/manticore   # WAL realtime-документов: переживает рестарт
    binlog_retention_period = 600

    # локальная машина: бережём RAM/CPU
    threads        = 4
    max_cached_mmap_threads = 1
    mmap_limit     = 0

    # защита от дурака при fuzzy/infix-запросах
    expansion_limit = 128
    rt_flush_period = 30               # сброс delta-chunk на диск каждые 30с
}

# Индекс `docs` создаётся приложением через SQL (CREATE TABLE), поэтому здесь
# он не объявлен. Если нужен plain-индекс с периодическим indexer --rotate,
# раскомментируйте и добавьте job в CI:
#
# index docs
# {
#     type           = plain
#     path           = /var/lib/manticore/docs
#     source         = src_sqlite
#     sql_query      = SELECT id, file_id, chunk, title, body, path FROM docs_view
#     sql_attr_bigint = file_id
# }
#
# source src_sqlite
# {
#     type     = sqlite3
#     sqlite3_db = /data/meta.db
# }
