# ============================================================
# Реверс-прокси LocalSearch Server (HTTPS) — вариант "фронт"
# ------------------------------------------------------------
# Ситуация: на сервере крутится localsearch serve-server по HTTP
# (127.0.0.1:8341), а клиентам нужен HTTPS с нормальным сертификатом.
# nginx терминирует TLS, проксирует API и WebSocket /ws/progress.
#
# Установка (без Docker):
#   Debian/Ubuntu:  sudo apt install nginx && sudo cp deploy/nginx.conf \
#                       /etc/nginx/sites-available/localsearch && \
#                   sudo ln -s ../sites-available/localsearch /etc/nginx/sites-enabled/ && \
#                   sudo nginx -t && sudo systemctl reload nginx
#   Сертификат Let's Encrypt: sudo apt install certbot python3-certbot-nginx &&
#                   sudo certbot --nginx -d search.example.local
#   Self-signed для внутренней сети (см. deploy/make_selfsigned_cert.sh):
#                   ssl_certificate /etc/nginx/tls/localsearch.crt; ...
# ============================================================

# --- HTTP: только редирект на HTTPS + ACME-челлендж -------------
server {
    listen 80;
    listen [::]:80;
    server_name search.example.local;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name search.example.local;

    ssl_certificate     /etc/nginx/tls/localsearch.crt;   # или путь certbot
    ssl_certificate_key /etc/nginx/tls/localsearch.key;
    ssl_protocols       TLSv1.2 TLSv1.3;                  # никаких TLS1.0/1.1
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # HSTS — после того как сертификат точно рабочий:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Загрузка файлов клиентами: лимит должен быть >= server.max_upload_mb
    client_max_body_size 64m;
    client_body_buffer_size 1m;

    # Таймауты: долгие sync-delta батчи и первичный скан
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    # Бэкенд — обычный localsearch serve-server (uvicorn на 127.0.0.1:8341)
    upstream localsearch_backend {
        server 127.0.0.1:8341;
        keepalive 16;
    }

    # WebSocket прогресса индексации (важно: upgrade-заголовки!)
    location /ws/ {
        proxy_pass http://localsearch_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;   # долгоживущие соединения
    }

    # REST API + веб-UI
    location / {
        proxy_pass http://localsearch_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        # потоковая отдача ответов (chunked upload у ingest)
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Дополнительная защита на уровне фронта (опционально):
    # allow 10.0.0.0/8; deny all;      — пускать только внутреннюю сеть
    # limit_req zone=api burst=20;     — см. limit_req_zone в http{} ниже
}

# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;  # раскомментировать в http-контексте
